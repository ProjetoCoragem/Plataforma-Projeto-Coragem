<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nova Apostila | Projeto Coragem</title><link rel="stylesheet" href="styles.css"></head>
<body data-role="admin" data-page="apostilas" data-title="Apostilas"><div class="shell"><div id="shellSidebar"></div><div class="main"><div id="shellTopbar"></div><main class="content">
<div class="page-head"><div><div class="kicker">Conteúdo formativo</div><h2>Nova apostila</h2><p>Monte um conteúdo de estudo com texto, mídias e questões de fixação.</p></div><a class="btn btn-secondary" href="apostilas.html">← Voltar</a></div><div id="message" class="message"></div>
<form id="apostilaForm" class="card form-card">
<div class="form-section"><h3>Identificação</h3></div>
<div class="field"><label>Título *</label><input id="titulo" required placeholder="Ex.: Direitos e deveres do jovem aprendiz"></div>
<div class="form-row"><div class="field"><label>Tema *</label><select id="tema" required><option value="">Selecione</option><option>Mercado de Trabalho</option><option>Ética</option><option>Comunicação</option><option>Trabalho em Equipe</option><option>Responsabilidade</option><option>Educação Financeira</option><option>Direitos e Deveres</option><option>Informática</option><option>Saúde e Bem-estar</option><option>Meio Ambiente</option><option>Projeto de Vida</option><option>Outro</option></select></div><div class="field"><label>Turma</label><input id="turma" placeholder="Deixe vazio para todas"></div></div>
<div class="form-row"><div class="field"><label>Prazo</label><input id="prazo" type="datetime-local"></div><div class="field"><label>Status</label><select id="status"><option>Publicada</option><option>Rascunho</option></select></div></div>
<div class="form-section"><h3>Conteúdo</h3></div><div class="field"><label>Introdução</label><textarea id="introducao"></textarea></div><div class="field"><label>Texto principal *</label><textarea id="conteudo" style="min-height:280px" required></textarea></div><div class="field"><label>Pergunta para reflexão</label><textarea id="reflexao"></textarea></div>
<div class="form-section"><h3>Mídias opcionais</h3><p>Informe links públicos. Vídeos do YouTube são convertidos automaticamente.</p></div>
<div class="form-row"><div class="field"><label>URL de imagem</label><input id="imagemUrl" type="url"></div><div class="field"><label>Legenda da imagem</label><input id="imagemLegenda"></div></div>
<div class="form-row"><div class="field"><label>URL de vídeo/YouTube</label><input id="videoUrl" type="url"></div><div class="field"><label>Legenda do vídeo</label><input id="videoLegenda"></div></div>
<div class="form-section"><h3>Questões de fixação</h3></div><div id="questionsBuilder"></div><div class="actions"><button id="addMultiple" class="btn btn-secondary" type="button">+ Múltipla escolha</button><button id="addVF" class="btn btn-secondary" type="button">+ V/F</button><button id="addShort" class="btn btn-secondary" type="button">+ Resposta curta</button></div>
<div class="actions" style="margin-top:20px"><a href="apostilas.html" class="btn btn-secondary">Cancelar</a><button class="btn btn-primary" type="submit">Salvar apostila</button></div></form>
</main></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="core.js"></script></body></html>
